packages:
  - '.'

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3

supportedArchitectures:
  os:
    - darwin
    - current
  cpu:
    - x64
    - arm64
